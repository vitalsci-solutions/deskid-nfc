<!doctype html>
<!-- Source for og.png. Render at 1200x630 (dpr 1) and screenshot to og.png. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #131211;
        color: #ece8e4;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        overflow: hidden;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-ligatures: none;
        font-size: 26px;
        font-weight: 600;
        color: #ece8e4;
      }
      .top svg {
        width: 42px;
        height: 42px;
      }
      h1 {
        margin: 0;
        font-size: 88px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        font-weight: 640;
        max-width: 20ch;
      }
      .meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 25px;
        color: #a8a29e;
      }
      .meta .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-ligatures: none;
        color: #fb923c;
        font-size: 23px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#fb923c" />
        <g stroke="#1a1005" stroke-width="2.2" stroke-linecap="round">
          <path d="M12.5 10.5a7.4 7.4 0 0 1 0 11" />
          <path d="M17.4 7.4a12 12 0 0 1 0 17.2" opacity=".55" />
        </g>
        <circle cx="9" cy="16" r="1.7" fill="#1a1005" />
      </svg>
      deskid-nfc
    </div>

    <h1>Metratec DeskID NFC, in the browser</h1>

    <div class="meta">
      <span>WebSerial tag events, NDEF read and write, zero dependencies</span>
      <span class="mono">npm i deskid-nfc</span>
    </div>
  </body>
</html>
